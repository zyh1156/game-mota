<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0a11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>魔塔 50 · 高清重制</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="app" id="app">

  <header class="hud" id="hud">
    <div class="hud-left">
      <div class="floor-badge"><span id="hud-floor">1</span><small>层</small></div>
      <div class="hud-title"><b>魔塔 50</b><i id="hud-theme">地牢外围</i></div>
    </div>
    <div class="hud-stats">
      <div class="chip chip-hp"><span class="chip-ico">♥</span><b id="hud-hp">1000</b></div>
      <div class="chip chip-atk"><span class="chip-ico">⚔</span><b id="hud-atk">10</b></div>
      <div class="chip chip-def"><span class="chip-ico">⛨</span><b id="hud-def">10</b></div>
    </div>
    <div class="hud-sub">
      <div class="chip chip-gold"><span class="chip-ico">◉</span><b id="hud-gold">0</b></div>
      <div class="keys">
        <span class="key key-y"><i></i><b id="hud-ky">1</b></span>
        <span class="key key-b"><i></i><b id="hud-kb">0</b></span>
        <span class="key key-r"><i></i><b id="hud-kr">0</b></span>
      </div>
      <button class="gear-btn" id="btn-equip-quick" aria-label="装备">
        <span class="equip-mini" id="equip-mini"></span>
      </button>
    </div>
  </header>

  <section class="stage" id="stage">
    <canvas id="board" width="400" height="400" aria-label="魔塔地图"></canvas>
    <div class="card" id="card" hidden aria-live="polite">
      <div class="card-head">
        <span class="card-name" id="card-name">怪物</span>
        <span class="card-tag" id="card-tag">可战胜</span>
      </div>
      <div class="card-stats"><span>生命 <b id="card-hp">0</b></span><span>攻击 <b id="card-atk">0</b></span><span>防御 <b id="card-def">0</b></span></div>
      <div class="card-predict">
        <div class="pred-main"><span>预计损失</span><b id="card-loss">0</b></div>
        <div class="pred-side"><span>战后剩余</span><b id="card-left">0</b></div>
        <div class="pred-side"><span>金币收益</span><b id="card-gold">0</b></div>
      </div>
      <div class="card-range" id="card-range"></div>
      <div class="card-tip" id="card-tip"></div>
    </div>
  </section>

  <nav class="pad" aria-label="移动与操作">
    <div class="dpad">
      <button class="dbtn up" data-dir="up" aria-label="向上"><svg viewBox="0 0 24 24"><path d="m5 14 7-7 7 7"/></svg></button>
      <button class="dbtn left" data-dir="left" aria-label="向左"><svg viewBox="0 0 24 24"><path d="m5 14 7-7 7 7"/></svg></button>
      <button class="dbtn right" data-dir="right" aria-label="向右"><svg viewBox="0 0 24 24"><path d="m5 14 7-7 7 7"/></svg></button>
      <button class="dbtn down" data-dir="down" aria-label="向下"><svg viewBox="0 0 24 24"><path d="m5 14 7-7 7 7"/></svg></button>
    </div>
    <div class="acts">
      <button class="abtn" id="btn-manual"><b>手册</b><span>怪物情报</span></button>
      <button class="abtn" id="btn-equip"><b>装备</b><span>附加效果</span></button>
      <button class="abtn" id="btn-menu"><b>菜单</b><span>重新开始</span></button>
      <button class="abtn abtn-go" id="btn-fight" disabled><b>攻击</b><span>相邻目标</span></button>
    </div>
  </nav>

  <aside class="side" aria-label="当前楼层情报">
    <div class="side-block">
      <h3>本层怪物</h3>
      <div class="side-list" id="side-list"></div>
    </div>
    <div class="side-block side-tips">
      <h3>操作</h3>
      <p>方向键 / WASD 移动 · 撞向怪物即开战</p>
      <p>点击怪物可查看战斗预估与收益</p>
      <p>B 手册 · E 装备 · Esc 菜单</p>
    </div>
  </aside>
</div>

<div class="battle" id="battle" hidden>
  <canvas id="bcanvas"></canvas>
  <button class="battle-skip" id="battle-skip">点击跳过</button>
</div>

<div class="sheet-wrap" id="sheet-wrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <header class="sheet-head"><h2 id="sheet-title">标题</h2><button class="sheet-close" id="sheet-close" aria-label="关闭">✕</button></header>
    <div class="sheet-body" id="sheet-body"></div>
    <footer class="sheet-foot" id="sheet-foot"></footer>
  </div>
</div>

<script src="../js/game-core.js"></script>
<script src="../js/art.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/ui.js"></script>
<script>
const q = new URLSearchParams(location.search);
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
(async () => {
  while(!window.MTHD) await wait(30);
  await wait(400);
  const G = MTHD.game();
  const scenario = q.get('case') || 'battle';
  if (scenario === 'battle') {
    const mons = G.floorMonsters();
    const adj = mons.find(m => Math.abs(m.x-G.x)+Math.abs(m.y-G.y)===1);
    if (adj) MTHD.startBattle(adj.x, adj.y);
    else { const m = mons[0]; G.x=m.x; G.y=m.y+1; MTHD.teleport(m.x,m.y+1); MTHD.startBattle(m.x,m.y); }
  } else if (scenario === 'boss') {
    G.hp = 3900; G.atk = 30; G.def = 32; G.keys.y = 11; G.keys.b = 1; G.keys.r = 1;
    for (let f=2; f<=10; f++) G.travel('up');
    const b = G.map.boss;
    // 传到 Boss 相邻格
    G.x = b.x + 1; G.y = b.y;
    MTHD.teleport(G.x, G.y);
    MTHD.hideCard();
    MTHD.startBattle(b.x, b.y);
  } else if (scenario === 'bossmap') {
    G.hp = 3900; G.atk = 30; G.def = 32; G.keys.r = 1; G.keys.b = 1;
    for (let f=2; f<=10; f++) G.travel('up');
    MTHD.teleport(5, 7);
  } else if (scenario === 'map5') {
    G.hp = 1500; G.atk = 16; G.def = 14;
    for (let f=2; f<=5; f++) G.travel('up');
    MTHD.teleport(5, 5);
  } else if (scenario === 'equip') {
    G.inv.push('sword','armor','satan','necroBook'); G.necroOwned = true; G.necroEnergy = 23;
    MTHD.teleport(G.x, G.y);
    MTHD.openEquip();
  } else if (scenario === 'map20') {
    // 蓝锁取舍层样本：F8（蓝门宝物房 + 双蓝箱）
    G.hp = 2400; G.atk = 18; G.def = 15; G.keys.y = 6; G.keys.b = 1;
    for (let f=2; f<=8; f++) G.travel('up');
    MTHD.teleport(5, 5);
  } else if (scenario === 'manual') {
    MTHD.openManual();
  } else if (scenario === 'shop') {
    G.gold = 5000; MTHD.openShop();
  } else if (scenario === 'bossitem') {
    // Boss 层：物品可拾取（无红框）、楼梯红框警示
    G.hp = 3900; G.atk = 30; G.def = 32; G.keys.r = 1;
    for (let f=2; f<=10; f++) G.travel('up');
    MTHD.teleport(5, 5);
  } else if (scenario === 'gatefloat') {
    // 撞门：到第 6 层（有蓝门），黄钥匙清零，走向蓝门
    await wait(80);
    G.hp = 900; G.atk = 14; G.def = 12; G.keys.y = 0; G.keys.b = 0; G.keys.r = 0;
    for (let f=2; f<=6; f++) G.travel('up');
    const gg = G.map.g;
    let gate = null;
    for (let y=0;y<11&&!gate;y++) for (let x=0;x<11&&!gate;x++) {
      const c = gg[y][x];
      if (c.t === 'gate' && c.color === 'b') gate = {x,y};
    }
    if (gate) {
      // 站到门的下方或上方相邻空格
      const spots = [[0,1],[0,-1],[1,0],[-1,0]].map(d=>({x:gate.x+d[0],y:gate.y+d[1]}))
        .filter(p=>p.x>=0&&p.y>=0&&p.x<11&&p.y<11&&gg[p.y][p.x].t==='floor'&&!gg[p.y][p.x].o);
      const sp = spots[0];
      G.x = sp.x; G.y = sp.y;
      MTHD.teleport(G.x, G.y);
      MTHD.hideCard();
      MTHD.move(gate.y > sp.y ? 'down' : gate.y < sp.y ? 'up' : gate.x > sp.x ? 'right' : 'left');
    }
  } else if (scenario === 'gatecolors') {
    // 门色总览：造 3 个门直接看（传送 F6）
    await wait(80);
    G.hp = 900; G.atk = 14; G.def = 12;
    for (let f=2; f<=6; f++) G.travel('up');
    MTHD.teleport(5, 5);
  } else if (scenario === 'pickfloat') {
    // 拾取飘字：走向相邻道具
    await wait(80);
    const g = G.map.g;
    let target = null;
    for (let y=0;y<11&&!target;y++) for (let x=0;x<11&&!target;x++) {
      const c = g[y][x];
      if (c.o && c.o.kind === 'item' && Math.abs(x-G.x)+Math.abs(y-G.y) <= 3) target = {x,y};
    }
    if (target) {
      G.x = target.x; G.y = Math.min(9, target.y+1);
      MTHD.teleport(G.x, G.y);
      MTHD.move('up'); // 真实移动触发拾取 + 飘字
    }
  } else if (scenario === 'oneshot') {
    // 零损耗：高攻击秒杀，应跳过战斗动画直接结算
    G.hp = 2000; G.atk = 500; G.def = 50;
    await wait(100);
    const mons = G.floorMonsters();
    const m = mons[0];
    G.x = m.x; G.y = m.y + 1;
    MTHD.teleport(G.x, G.y);
    MTHD.hideCard();
    await wait(80);
    MTHD.startBattle(m.x, m.y);
    window.__test = { overlayHidden: document.getElementById('battle').hidden, monGone: true };
    await wait(500);
    window.__test.monGone = !MTHD.game().cell(m.x, m.y).o;
  } else if (scenario === 'manual10') {
    G.hp = 3900; G.atk = 30; G.def = 32; G.keys.r = 1;
    for (let f=2; f<=10; f++) G.travel('up');
    MTHD.openManual();
  } else if (scenario === 'card') {
    const mons = G.floorMonsters();
    const m = mons[0]; MTHD.teleport(m.x, Math.max(1,m.y-1)); MTHD.showCard(m.x, m.y);
  }
})();
</script>
</body>
</html>
