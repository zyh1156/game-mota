<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#20242c}canvas{display:block}</style></head>
<body><canvas id="c" width="1200" height="900"></canvas>
<script>window.onerror=function(m,s,l){document.title='ERR '+m+' @'+l;};</script>
<script src="../js/game-core.js"></script><script src="../js/art.js"></script><script>
const Art=MT.Art;
const c=document.getElementById('c').getContext('2d');
try{
  c.font='20px sans-serif';c.fillStyle='#fff';
  c.fillText('MT='+(typeof MT)+' Art='+(typeof MT !== 'undefined' ? typeof MT.Art : 'noMT'),20,30);
  const ids=Object.keys(MT.MONSTERS);
  let i=0;
  for(let y=0;y<4;y++)for(let x=0;x<5;x++){
    const id=ids[i++]; if(!id)break;
    c.fillStyle='#e8e4da';c.fillRect(x*240+20,y*225+20,200,185);
    const m=MT.scaleMonster(id,1);
    Art.drawMonster(c,m,x*240+120,y*225+112,150,0.6);
  }
  Art.drawHero(c,600,880,170,0.6);
}catch(e){c.fillStyle='#ff8888';c.font='16px monospace';c.fillText(String(e && e.stack || e).slice(0,600),20,60);}
</script></body></html>
